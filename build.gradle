plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '7.1.0'
}

group 'com.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'net.portswigger.burp.extensions:montoya-api:2023.9'
}

shadowJar {
    archiveBaseName.set('NewJSLink')
    archiveClassifier.set('')
    archiveVersion.set('')
}
